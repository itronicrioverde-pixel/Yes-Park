name: Yes Park - backup publicacao
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/backup-live.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const base='https://itronicrioverde-pixel.github.io/Yes-Park/';
          for(const [path,marker] of [['','yespark-backup-panel'],['js/backup.js?v=20261127-backup1','yespark_restore_backup'],['js/app.js?v=20261127-backup1','YesparkBackup?.mount'],['js/vendor/jszip-3.10.1.min.js','JSZip v3.10.1']]){
            let ok=false;
            for(let attempt=0;attempt<3;attempt++){const r=await fetch(base+path,{signal:AbortSignal.timeout(10000),cache:'no-store'});const t=await r.text();if(r.ok&&t.includes(marker)){ok=true;console.log('PASS HTTP '+r.status+' '+(path||'home'));break}await new Promise(r=>setTimeout(r,5000))}
            assert(ok,'Arquivo ainda nao publicado: '+path);
          }
          const c=readFileSync('js/config.js','utf8'),key=c.match(/supabaseAnonKey:\s*['"]([^'"]+)['"]/)?.[1];
          assert(key&&(key.startsWith('sb_publishable_')||JSON.parse(Buffer.from(key.split('.')[1],'base64url')).role==='anon'));
          const api='https://ajerazedcephwtpwxnvl.supabase.co/rest/v1/rpc/yespark_export_backup';
          const r=await fetch(api,{method:'POST',headers:{apikey:key,...(key.startsWith('sb_publishable_')?{}:{Authorization:'Bearer '+key}),'Content-Type':'application/json'},body:'{}',signal:AbortSignal.timeout(10000)});
          assert([401,403,404].includes(r.status));console.log('PASS exportacao anonima bloqueada: HTTP '+r.status);
          NODE
