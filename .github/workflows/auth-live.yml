name: Yes Park - auth publicacao
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/auth-live.yml']
permissions:
  contents: read
jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const base='https://itronicrioverde-pixel.github.io/Yes-Park/';
          for(const [path,marker] of [['','20261127-auth2'],['recuperar.html','20261127-auth2'],['js/app.js?v=20261127-auth2',"password=String(f.get('password')??'')"],['js/recovery.js?v=20261127-auth2',"hash.has('error_code')"]]){
            let ok=false;
            for(let i=0;i<4;i++){const r=await fetch(base+path,{signal:AbortSignal.timeout(10000),cache:'no-store'});if(r.ok&&(await r.text()).includes(marker)){ok=true;console.log('PASS HTTP '+r.status+' '+(path||'home'));break}await new Promise(r=>setTimeout(r,3000))}
            assert(ok,'Arquivo ainda nao publicado: '+path);
          }
          const c=readFileSync('js/config.js','utf8'),key=c.match(/supabaseAnonKey:\s*['"]([^'"]+)['"]/)?.[1];
          assert(key&&(key.startsWith('sb_publishable_')||JSON.parse(Buffer.from(key.split('.')[1],'base64url')).role==='anon'));
          const auth='https://ajerazedcephwtpwxnvl.supabase.co/auth/v1',headers={apikey:key,'Content-Type':'application/json'};
          let r=await fetch(auth+'/health',{headers,signal:AbortSignal.timeout(10000)});
          assert.equal(r.status,200);console.log('PASS auth health HTTP '+r.status);
          r=await fetch(auth+'/user',{headers,signal:AbortSignal.timeout(10000)});
          assert([401,403].includes(r.status));console.log('PASS unauthenticated user blocked HTTP '+r.status);
          NODE
